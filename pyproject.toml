[project]
name = "soup-job-queue"
version = "0.1.0"
description = "Training-job queue with leases, fencing and a chaos harness"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
load = ["locust>=2.31"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# DATABASE_URL must be set before app.config is imported.
"tests/conftest.py" = ["E402"]
